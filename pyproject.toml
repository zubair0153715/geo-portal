[project]
name = "geo-portal"
version = "1.0.0"
description = "AI Visibility Audit — GEO client portal (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "cryptography>=42",
    "httpx>=0.27",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.fastapi-cloud]
# App entrypoint auto-detected as app/main.py:app
