# Render blueprint for the AI Visibility Portal (free tier).
# Deploy: push this repo to GitHub, then in Render → New → Blueprint → pick the repo.
services:
  - type: web
    name: geo-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon Postgres connection string
      - key: GEO_VAULT_KEY
        sync: false          # Fernet key: python -m app.vault genkey
      - key: GEO_SESSION_SECRET
        sync: false          # python -c "import secrets; print(secrets.token_hex(32))"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false          # https://<your-app>.onrender.com/connect/google/callback
      - key: PUBLIC_URL
        sync: false          # https://<your-app>.onrender.com
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: DEMO_MODE
        value: "0"
